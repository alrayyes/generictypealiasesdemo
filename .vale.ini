StylesPath = styles
MinAlertLevel = warning
Packages = Google, proselint
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint
Vale.Terms = YES
# Google.We flags "we", which is how a README about a project written by more
# than one person reads. Not a correctness problem.
Google.We = NO
# Google wants unspaced em dashes. The house style here spaces them, and a
# style guide doesn't get to rewrite punctuation the author chose.
Google.EmDash = NO
