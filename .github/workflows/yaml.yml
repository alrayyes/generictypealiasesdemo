name: YAML

on:
  push:

permissions:
  contents: read

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: pipx install yamllint==1.38.0
      - name: yamllint
        run: yamllint --strict .
