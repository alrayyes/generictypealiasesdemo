name: Linting
on:
  push:

jobs:
  lint:
    # No matrix, on purpose. GitHub appends the matrix value to the job name, so
    # a one-entry matrix called this check "Prettier & markdown linting (23)" and
    # renamed it every time the version moved. The branch ruleset requires it by
    # name, and it was still asking for "(20)" — a check nothing had produced
    # since the bump, which is a merge that hangs rather than an error anyone
    # sees. The name is written once here, where renaming it is a deliberate act
    # that goes with an edit to the ruleset.
    #
    # Which is why this still says Prettier and markdown when the job also runs
    # Biome. The name is a ruleset key, not a description; changing it to read
    # better costs a hung merge on every open pull request that already reported
    # under the old one.
    name: Prettier & markdown linting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Read from `packageManager` in package.json, so the version is
          # written down once and CI can't quietly float off it.
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome lint
        run: bun biome:lint .
      - name: Prettier lint
        run: bun prettier:lint "**/*.{md,yml,yaml}"
      - name: markdown lint
        run: bun markdown:lint
